<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><title>MangaAtlasRaw Admin</title><link rel="stylesheet" href="admin.css?v=20260912"></head><body><div class="wrap"><header><a href="../">← MangaAtlasRaw</a><h1>⚙️ MangaAtlasRaw Admin</h1><p>日本向け専用のGitHubコンテンツ管理画面です。トークンはこのブラウザのセッションだけに保存されます。</p></header><section id="login" class="panel"><h2>GitHubに接続</h2><label>GitHub Personal Access Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><div class="grid2"><div><label>Owner <small>(auto-detected)</small></label><input id="owner" placeholder="mangaatlasraw"></div><div><label>Repository <small>(auto-detected)</small></label><input id="repo" placeholder="mangaatlasraw.github.io"></div></div><button id="connect">Connect & Load</button><p id="loginStatus" class="status"></p></section><section id="app" class="hidden"><div class="toolbar panel"><div><b id="repoLabel"></b><span> · main</span></div><div><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Forget token</button><a class="button secondary" href="../">Open site</a></div></div><div id="status" class="status"></div><section class="panel"><h2>Dashboard</h2><div id="stats" class="stats"></div></section><section class="panel"><h2>日本漫画管理</h2><div class="grid2"><div><label>Title</label><input id="mTitle"></div><div><label>Native title</label><input id="mNative"></div><div><label>Slug</label><input id="mSlug" placeholder="one-piece"></div><div><label>Country</label><select id="mCountry"><option value="JP">🇯🇵 Japan</option></select></div><div><label>Language</label><input id="mLanguage" value="Japanese" placeholder="Japanese"></div><div><label>Status</label><select id="mStatus"><option>Ongoing</option><option>Completed</option><option>Hiatus</option></select></div><div><label>Author</label><input id="mAuthor"></div><div><label>Artist</label><input id="mArtist"></div><div><label>Publisher</label><input id="mPublisher"></div><div><label>Magazine</label><input id="mMagazine"></div><div><label>Release date</label><input id="mRelease" type="date"></div><div><label>Official URL</label><input id="mOfficial" type="url"></div></div><label>Description</label><textarea id="mDescription"></textarea><label>Genres / keywords <small>comma separated</small></label><input id="mGenres" placeholder="Action, Shonen, Manga RAW"><div class="uploadline"><div><label>Cover image</label><input id="mCover" type="file" accept="image/jpeg,image/png,image/webp"></div><button id="saveManga">Add manga</button><button class="secondary" id="resetManga">Reset</button></div><div id="mangaList" class="list"></div></section><section class="panel"><h2>Chapter management</h2><div class="grid2"><div><label>Manga</label><select id="cManga"></select></div><div><label>Chapter number</label><input id="cNumber" type="number" min="0" step="0.1"></div><div><label>Chapter title</label><input id="cTitle"></div><div><label>URL slug</label><input id="cSlug" placeholder="one-piece-raw-1193"></div><div><label>Country</label><select id="cCountry"><option value="JP">🇯🇵 Japan</option></select></div></div><div class="actions"><button id="saveChapter">Add chapter</button><button class="secondary" id="resetChapter">Reset</button></div><div id="chapterList" class="list"></div></section><section id="uploadPanel" class="panel hidden"><h2>Chapter images</h2><p id="selectedChapter" class="muted"></p><div class="parts"><div class="part"><b>Part 1 — images 1–10</b><input id="pages1" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Max 10 files</small><button id="upload1">Upload Part 1</button><pre id="progress1"></pre></div><div class="part"><b>Part 2 — images 11–20</b><input id="pages2" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Max 10 files</small><button id="upload2">Upload Part 2</button><pre id="progress2"></pre></div></div><button class="danger" id="clearImages">Delete all chapter images</button></section></section><script>
(()=>{const nativeFetch=window.fetch;let replaceStarted=false;window.fetch=async function(input,init={}){const isChapterPut=typeof input==='string'&&/\/contents\/chapter-images\//.test(input)&&String(init.method||'GET').toUpperCase()==='PUT'&&init.body;if(isChapterPut&&!replaceStarted){try{const body=typeof init.body==='string'?JSON.parse(init.body):null;const url=typeof input==='string'?input:input.url;const path=decodeURIComponent(url.split('/contents/')[1].split('?')[0]);if(body&&/\/page-001\.webp$/.test(path)){const dir=path.substring(0,path.lastIndexOf('/'));const listUrl=url.split('/contents/')[0]+'/contents/'+dir+'?ref='+encodeURIComponent(body.branch||'main');const list=await nativeFetch(listUrl,{method:'GET',headers:init.headers||{},cache:'no-store'});if(list.ok){const files=await list.json();for(const f of Array.isArray(files)?files:[]){if(f.type!=='file')continue;await nativeFetch(url.split('/contents/')[0]+'/contents/'+f.path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:init.headers||{},body:JSON.stringify({message:'Replace chapter images - delete old '+f.path,sha:f.sha,branch:body.branch||'main'}),cache:'no-store'})}}replaceStarted=true}catch(_){}}let attempt=0;while(true){let res;try{res=await nativeFetch(input,init)}catch(err){if(attempt>=5)throw err;await new Promise(r=>setTimeout(r,700+attempt*700));attempt++;continue}if(res.status!==409||!init||!init.body||attempt>=5)return res;let body,url;try{body=typeof init.body==='string'?JSON.parse(init.body):null;url=typeof input==='string'?input:input.url}catch(_){return res}if(!body||!body.content||body.sha===undefined)return res;const base=url.split('?')[0],ref=body.branch||'main';await new Promise(r=>setTimeout(r,300+attempt*500));let get;try{get=await nativeFetch(base+'?ref='+encodeURIComponent(ref),{method:'GET',headers:init.headers||{},cache:'no-store'})}catch(_){attempt++;continue}if(!get.ok)return res;const current=await get.json();if(!current.sha)return res;body.sha=current.sha;init={...init,body:JSON.stringify(body)};attempt++}}})();
</script><script src="admin.js?v=20260913-5"></script></body></html>
