(()=>{const nativeFetch=window.fetch;let replaceStarted=false;window.fetch=async function(input,init={}){const isChapterPut=typeof input==='string'&&/\/contents\/chapter-images\//.test(input)&&String(init.method||'GET').toUpperCase()==='PUT'&&init.body;if(isChapterPut&&!replaceStarted){try{const body=typeof init.body==='string'?JSON.parse(init.body):null;const url=typeof input==='string'?input:input.url;const path=decodeURIComponent(url.split('/contents/')[1].split('?')[0]);if(body&&/\/page-001\.webp$/.test(path)){const dir=path.substring(0,path.lastIndexOf('/'));const listUrl=url.split('/contents/')[0]+'/contents/'+dir+'?ref='+encodeURIComponent(body.branch||'main');const list=await nativeFetch(listUrl,{method:'GET',headers:init.headers||{},cache:'no-store'});if(list.ok){const files=await list.json();for(const f of Array.isArray(files)?files:[]){if(f.type!=='file')continue;await nativeFetch(url.split('/contents/')[0]+'/contents/'+f.path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:init.headers||{},body:JSON.stringify({message:'Replace chapter images - delete old '+f.path,sha:f.sha,branch:body.branch||'main'}),cache:'no-store'})}}replaceStarted=true}catch(_){}}let attempt=0;while(true){let res;try{res=await nativeFetch(input,init)}catch(err){if(attempt>=7)throw err;await new Promise(r=>setTimeout(r,800+attempt*900));attempt++;continue}if(res.status!==409||!init||!init.body||attempt>=7)return res;let body,url;try{body=typeof init.body==='string'?JSON.parse(init.body):null;url=typeof input==='string'?input:input.url}catch(_){return res}if(!body||!body.content||body.sha===undefined)return res;const base=url.split('?')[0],ref=body.branch||'main';await new Promise(r=>setTimeout(r,400+attempt*600));let get;try{get=await nativeFetch(base+'?ref='+encodeURIComponent(ref),{method:'GET',headers:init.headers||{},cache:'no-store'})}catch(_){attempt++;continue}if(!get.ok)return res;const current=await get.json();if(!current.sha)return res;body.sha=current.sha;init={...init,body:JSON.stringify(body)};attempt++}}})();
</script><script src="admin.js?v=20260913-6"></script><script>
(()=>{
const stableUpload=async(path,file)=>{const buf=new Uint8Array(await file.arrayBuffer()),encoded=path.split('/').map(encodeURIComponent).join('/');let payload={message:'Upload '+path,content:b64(buf),branch};for(let attempt=0;attempt<8;attempt++){try{return (await gh('/contents/'+encoded,{method:'PUT',body:JSON.stringify(payload)})).content.path}catch(e){const text=String(e.message||e);if(text.includes('409')){try{const old=await gh('/contents/'+encoded+'?ref='+encodeURIComponent(branch));if(old?.sha)payload={...payload,sha:old.sha}}catch(_){}await sleep(700+attempt*700);continue}if(attempt===7)throw e;await sleep(900+attempt*900)}}throw Error('Upload failed after retries.')};
const reliableUploadPart=async(which)=>{const input=$(which===1?'pages1':'pages2'),out=$(which===1?'progress1':'progress2'),files=[...input.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));let busy=false;try{if(busy)return;if(!editChapterId)throw Error('Select/save a chapter first.');if(!files.length)throw Error('Select images first.');if(files.length>10)throw Error('Maximum 10 images per part.');busy=true;input.disabled=true;$(which===1?'upload1':'upload2').disabled=true;out.textContent='';if(which===1){out.textContent='Removing old chapter images…\n';const latest0=await readDb(),c0=latest0.data.chapters.find(x=>x.id===editChapterId);if(!c0)throw Error('Chapter not found.');await deleteDir(`chapter-images/${c0.mangaId}/chapter-${c0.number}`);out.textContent+='✓ Old images removed.\n'}const latest=await readDb(),c=latest.data.chapters.find(x=>x.id===editChapterId);if(!c)throw Error('Chapter not found.');const min=which===1?1:11,max=which===1?10:20;let pages=[...(c.pages||[])];for(let i=0;i<files.length;i++){out.textContent+=`Preparing ${i+1}/${files.length}…\n`;const f=await imageFile(files[i]);const n=min+i;const path=`chapter-images/${c.mangaId}/chapter-${c.number}/page-${String(n).padStart(3,'0')}.webp`;await stableUpload(path,f);pages[n-1]=path;out.textContent+=`✓ page ${n}\n`}c.pages=pages.filter(Boolean).sort((a,b)=>Number((a.match(/page-(\d+)/)||[])[1]||0)-Number((b.match(/page-(\d+)/)||[])[1]||0));c.updatedAt=new Date().toISOString();await writeDb(latest.data,latest.sha,`Upload chapter ${c.number} part ${which}`);db=latest.data;render();$('selectedChapter').textContent=`Selected: ${c.slug} · ${c.pages.length} registered pages`;out.textContent+='\n✓ Part uploaded successfully.';msg('✓ Chapter images saved to GitHub.')}catch(e){out.textContent+='\nERROR: '+e.message;msg('Error: '+e.message)}finally{busy=false;input.disabled=false;$(which===1?'upload1':'upload2').disabled=false}};
$('upload1').onclick=()=>reliableUploadPart(1);$('upload2').onclick=()=>reliableUploadPart(2);
