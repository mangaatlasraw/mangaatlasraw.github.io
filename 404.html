<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MangaAtlas</title></head><body><p>Loading MangaAtlas…</p><script>const p=location.pathname.replace(/\/+$/,'');const parts=p.split('/').filter(Boolean);const route=parts[0]||'';let slug=parts.slice(1).join('/');try{slug=decodeURIComponent(slug)}catch{}const prefix=location.pathname.split('/').filter(Boolean)[0]||'';const root=location.origin+(prefix&&prefix.endsWith('.github.io')?'':'/'+prefix).replace(/\/$/,'');if(route==='manga'&&slug)location.replace(root+'/manga.html?slug='+encodeURIComponent(slug));else if(route==='chapter'&&slug)location.replace(root+'/chapter.html?slug='+encodeURIComponent(slug));else if(['japan','usa','france','brazil'].includes(route)){const c={japan:'JP',usa:'US',france:'FR',brazil:'BR'}[route];location.replace(root+'/country.html?country='+c)}else location.replace(root+'/');</script></body></html>
