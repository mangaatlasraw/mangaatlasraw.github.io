<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta id="desc" name="description" content="Read manga chapters on MangaAtlasRaw."><link id="canonical" rel="canonical"><title>Chapter | MangaAtlasRaw</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:3;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;gap:15px}.bar a{color:#b7bdc9;text-decoration:none}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111;min-height:100px}.empty,.error{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b}.image-error{display:block;padding:20px;text-align:center;color:#ff8c9b;background:#171a22;margin:8px 0}@media(max-width:600px){.reader{width:100%}}</style></head><body><header class="bar"><a id="back" href="./">← MangaAtlasRaw</a><strong id="title">Chapter</strong></header><main id="reader" class="reader"><div class="empty">Loading chapter…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');function imageUrl(p){const s=String(p||'').trim().replace(/^\/+/, '');if(/^https?:\/\//i.test(s))return s;return new URL(s,location.origin+'/').href}function showImageError(img,url){const box=document.createElement('div');box.className='image-error';box.textContent='Image failed to load: '+url;img.replaceWith(box)}async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json HTTP '+x.status);return x.json()}),c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{},name=c.title||`${m.title||'Manga'} — Chapter ${c.number}`,pages=(c.pages||[]).map(x=>typeof x==='string'?x:(x&&x.url)||'').filter(Boolean);document.title=`${name} | MangaAtlasRaw`;document.getElementById('desc').content=`Read ${name} on MangaAtlasRaw.`;document.getElementById('canonical').href=location.href.split('#')[0];document.getElementById('title').textContent=name;document.getElementById('back').href='manga.html?slug='+encodeURIComponent(m.slug||'');if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}r.innerHTML=pages.map((p,i)=>{const url=imageUrl(p);return `<img class="page" src="${esc(url)}" alt="${esc(name)} page ${i+1}" loading="${i<2?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer">`}).join('');r.querySelectorAll('img.page').forEach(img=>{img.addEventListener('error',()=>showImageError(img,img.src),{once:true})})}catch(e){console.error(e);r.innerHTML='<div class="error">Could not load this chapter.</div>'}}init();</script></body></html>
