ing(p||'').trim().replace(/^\/+/, '');if(/^https?:\/\//i.test(s))return s;const u=new URL(s,location.origin+'/');if(version)u.searchParams.set('v',version);return u.href}function showImageError(img,url){const box=document.createElement('div');box.className='image-error';box.textContent='Image failed to load: '+url;img.replaceWith(box)}async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json HTTP '+x.status);return x.json()}),c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{},name=c.title||`${m.title||'Manga'} — Chapter ${c.number}`,pages=(c.pages||[]).map(x=>typeof x==='string'?x:(x&&x.url)||'').filter(Boolean),version=c.updatedAt||c.createdAt||Date.now();document.title=`${name} | MangaAtlasRaw`;document.getElementById('desc').content=`${name} をMangaAtlasRawで確認できます。最新話の情報と漫画ページをチェックしてください。`;document.getElementById('canonical').href=location.href.split('#')[0];document.getElementById('title').textContent=name;document.getElementById('back').href='manga.html?slug='+encodeURIComponent(m.slug||'');document.getElementById('seoTop').innerHTML=`<h1>${esc(name)}</h1><p><strong>${esc(name)}</strong>の最新話をMangaAtlasRawで確認できます。最新の漫画ページを読みながら、今回のエピソードを楽しめるページです。</p><p><strong>${esc(name)}</strong>を探している読者向けに、章のタイトルとページをまとめています。下の漫画ページから最新話を順番に確認できます。</p>`;if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}r.innerHTML=pages.map((p,i)=>{const url=imageUrl(p,version);return `<img class="page" src="${esc(url)}" alt="${esc(name)}" title="${esc(name)}" loading="eager" decoding="async" referrerpolicy="no-referrer">`}).join('');r.querySelectorAll('img.page').forEach(img=>{img.addEventListener('error',()=>showImageError(img,img.src),{once:true})});document.getElementById('seoBottom').innerHTML=`<h2>${esc(name)}</h2><p>${esc(name)}のページを最後まで確認できます。MangaAtlasRawでは、日本漫画の最新話を探している読者が章タイトルから目的のページへアクセスしやすいように整理しています。</p><p>${esc(name)}について最新話のページをチェックしたい場合は、このページから各画像を順番にご覧ください。漫画の更新を追いかけたい読者にも使いやすい章ページを目指しています。</p>`}catch(e){console.error(e);r.innerHTML='<div class="error">Could not load this chapter.</div>'}}init();</script></body></html>
