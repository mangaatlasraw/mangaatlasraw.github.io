<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta id="desc" name="description" content="Read manga chapters on MangaAtlas."><link id="canonical" rel="canonical"><title>Chapter | MangaAtlas</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:3;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;gap:15px}.bar a{color:#b7bdc9;text-decoration:none}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty,.error{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b}@media(max-width:600px){.reader{width:100%}}</style></head><body><header class="bar"><a id="back" href="./">← MangaAtlas</a><strong id="title">Chapter</strong></header><main id="reader" class="reader"><div class="empty">Loading chapter…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');function imageUrl(p){const s=String(p||'').replace(/^\//,'');return s.startsWith('http')?s:base+s}async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>x.json()),c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{},name=c.title||`${m.title||'Manga'} — Chapter ${c.number}`,pages=(c.pages||[]).map(x=>typeof x==='string'?x:x.url).filter(Boolean);document.title=`${name} | MangaAtlas`;document.getElementById('desc').content=`Read ${name} on MangaAtlas.`;document.getElementById('canonical').href=location.href.split('#')[0];document.getElementById('title').textContent=name;document.getElementById('back').href='manga.html?slug='+encodeURIComponent(m.slug||'');if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}r.innerHTML=pages.map((p,i)=>`<img class="page" src="${esc(imageUrl(p))}" alt="${esc(name)} page ${i+1}" loading="${i<2?'eager':'lazy'}" onerror="this.style.display='none'">`).join('')}catch(e){console.error(e);r.innerHTML='<div class="error">Could not load this chapter.</div>'}}init();</script></body></html>
