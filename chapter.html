(s,repoRaw);if(version)u.searchParams.set('v',version);return u.href}function pageUrl(p,version=''){return rawUrl(p,version)}function showImageError(img,url){const box=document.createElement('div');box.className='image-error';box.textContent='Image failed to load: '+url;img.replaceWith(box)}async function loadJson(){const urls=[repoRaw+'data/content.json?v='+Date.now(),base+'data/content.json?v='+Date.now()];for(const u of urls){try{const x=await fetch(u,{cache:'no-store'});if(x.ok)return await x.json()}catch(e){}}throw new Error('content.json unavailable')}async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await loadJson(),c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{},name=c.title||`${m.title||'Manga'} — Chapter ${c.number}`,pages=(c.pages||[]).map(x=>typeof x==='string'?x:(x&&x.url)||'').filter(Boolean),version=c.updatedAt||c.createdAt||Date.now(),mangaTitle=m.title||name.replace(/\s*(raw|Raw).*$/i,'');document.title=`${name} | MangaAtlasRaw`;document.getElementById('desc').content=`${name} をMangaAtlasRawで確認できます。最新話の情報と漫画ページをチェックしてください。`;document.getElementById('canonical').href=location.href.split('#')[0];document.getElementById('title').textContent=name;document.getElementById('back').href='manga.html?slug='+encodeURIComponent(m.slug||'');document.getElementById('seoTop').innerHTML=`<div class="eyebrow">LATEST CHAPTER</div><h1>${esc(name)}</h1><p><strong>${esc(name)}</strong>の最新話をMangaAtlasRawで確認できます。日本漫画の章タイトルとページを整理した、見やすいライトテーマのチャプターページです。</p><p><strong>${esc(name)}</strong>を探している読者向けに、今回の章の情報と漫画ページをまとめています。下のリーダーからページを順番に確認できます。</p><div class="chapter-meta"><span>Chapter ${esc(c.number)}</span><span>${pages.length} Pages</span><span>MangaAtlasRaw</span></div>`;document.getElementById('readerHead').textContent=`${name} — ${pages.length} pages`;if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}r.innerHTML=pages.map(p=>{const url=pageUrl(p,version);return `<img class="page" src="${esc(url)}" alt="${esc(name)}" title="${esc(name)}" loading="eager" decoding="async" referrerpolicy="no-referrer">`}).join('');r.querySelectorAll('img.page').forEach(img=>img.addEventListener('error',()=>showImageError(img,img.src),{once:true}));document.getElementById('seoBottom').innerHTML=`<div class="eyebrow">CHAPTER INFORMATION</div><h2>${esc(name)}</h2><p>${esc(name)}のページを最後まで確認できます。MangaAtlasRawでは、日本漫画の最新話を探している読者が章タイトルから目的のページへアクセスしやすいように、チャプターごとに整理しています。</p><p>${esc(name)}について最新話の漫画ページをチェックしたい場合は、このページから各画像を順番にご覧ください。スマートフォンとPCの両方で読みやすいレスポンシブ設計です。</p><p>最新の漫画Raw話を探している場合は、MangaAtlasRawの各作品ページから新しいチャプターをチェックできます。</p><div class="keyword-box"><h3>Related Keywords</h3><p>${esc(name)}に関連する検索キーワード:</p><div class="keyword-list"><span>${esc(name)}</span><span>${esc(mangaTitle)} Raw</span><span>${esc(mangaTitle)} Chapter ${esc(c.number)}</span><span>${esc(mangaTitle)} 第${esc(c.number)}話</span><span>${esc(mangaTitle)} 最新話</span><span>${esc(mangaTitle)} 漫画 Raw</span><span>${esc(mangaTitle)} manga</span><span>${esc(mangaTitle)} raw chapter</span><span>${esc(mangaTitle)} latest chapter</span><span>${esc(mangaTitle)} 第${esc(c.number)}話 Raw</span></div></div>`}catch(e){console.error(e);r.innerHTML='<div class="error">Could not load this chapter.</div>'}}init();</script></body></html>
