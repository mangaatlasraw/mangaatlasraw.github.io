<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta id="desc" name="description" content="Manga information and chapters on MangaAtlas."><link id="canonical" rel="canonical"><meta property="og:type" content="article"><meta property="og:site_name" content="MangaAtlas"><title>Manga | MangaAtlas</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1320px;margin:auto;padding:30px 5% 70px}.back{color:#a8adba}.hero{display:grid;grid-template-columns:280px 1fr;gap:35px;margin-top:25px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:15px;background:#151821}.title{font-size:clamp(38px,5vw,64px);line-height:1.08;margin:5px 0 10px}.native{color:#aab0bd;font-size:18px}.status{display:inline-block;margin:14px 0;padding:8px 13px;border-radius:999px;background:#183b73}.intro{color:#b5bac6;line-height:1.8}.meta{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #252934;border-bottom:1px solid #252934;margin-top:24px}.meta div{padding:15px;border-right:1px solid #252934}.meta strong{display:block;font-size:12px;margin-bottom:5px}.meta span{color:#9298a8;font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.tag{border:1px solid #303542;background:#11141b;border-radius:999px;padding:6px 9px;color:#b9bfcc;font-size:12px}.chapters{margin-top:40px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chapter{padding:16px;background:#10131a;border:1px solid #252a35;border-radius:12px}.chapter small{display:block;color:#818897;margin-top:5px}.empty{padding:60px 20px;text-align:center;color:#858c9b;border:1px dashed #303542}@media(max-width:850px){.hero{grid-template-columns:1fr}.cover{max-width:280px}.meta{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr 1fr}}@media(max-width:520px){.meta,.list{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid #252934}}</style></head><body><main class="wrap"><a class="back" href="./">← MangaAtlas</a><div id="app" class="empty">Loading manga…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',app=document.getElementById('app');if(!slug){app.textContent='Manga not found.';return}try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),m=(d.mangas||[]).find(x=>String(x.slug)===slug);if(!m){app.textContent='Manga not found.';return}const chapters=(d.chapters||[]).filter(c=>c.mangaId===m.id).sort((a,b)=>Number(b.number)-Number(a.number)),cover=m.cover?(m.cover.startsWith('http')?m.cover:base+m.cover):'https://placehold.co/600x800/151821/ffffff?text=Manga';document.title=`${m.title} | MangaAtlas`;document.getElementById('desc').content=`${m.title}${m.native_title?' ('+m.native_title+')':''} — manga information and latest chapters on MangaAtlas.`;document.getElementById('canonical').href=location.href.split('#')[0];app.className='';app.innerHTML=`<div class="hero"><img class="cover" src="${esc(cover)}" alt="${esc(m.title)} cover"><article><div>${esc(m.country||'')} · ${esc(m.language||'')}</div><h1 class="title">${esc(m.title)}</h1>${m.native_title?`<div class="native">${esc(m.native_title)}</div>`:''}<div class="status">${esc(m.status||'Ongoing')}</div><p class="intro">${esc(m.description||'No description yet.')}</p><div class="meta"><div><strong>Author</strong><span>${esc(m.author||'—')}</span></div><div><strong>Artist</strong><span>${esc(m.artist||'—')}</span></div><div><strong>Publisher</strong><span>${esc(m.publisher||'—')}</span></div><div><strong>Magazine</strong><span>${esc(m.magazine||'—')}</span></div></div>${(m.genres||[]).length?`<div class="tags">${m.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:''}${m.official_url?`<p><a href="${esc(m.official_url)}" rel="nofollow noopener" target="_blank">Official source →</a></p>`:''}</article></div><section class="chapters"><h2>📚 Chapters</h2><div class="list">${chapters.length?chapters.map(c=>`<a class="chapter" href="chapter.html?slug=${encodeURIComponent(c.slug)}"><b>Chapter ${esc(c.number)}${c.title?' — '+esc(c.title):''}</b><small>${esc(c.createdAt?new Date(c.createdAt).toLocaleDateString():'')}</small></a>`).join(''):'<div class="empty">No chapters yet.</div>'}</div></section>`}catch(e){console.error(e);app.textContent='Content could not be loaded.'}}init();</script></body></html>
