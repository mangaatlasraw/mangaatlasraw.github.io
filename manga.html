display:block;font-size:12px;margin-bottom:5px;color:#43536a}.meta span{color:#718092;font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.tag{border:1px solid #cce5d7;background:linear-gradient(135deg,#faf7ff,#effcf5);border-radius:999px;padding:6px 9px;color:#4c5f70;font-size:12px}.chapters{margin-top:40px}.chapters h2{color:#26354b}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chapter{padding:16px;background:rgba(255,255,255,.96);border:1px solid #d9ebe1;border-radius:14px;box-shadow:0 6px 18px rgba(45,105,76,.06);transition:.2s}.chapter:hover{transform:translateY(-3px);border-color:#96d2ae;box-shadow:0 12px 26px rgba(35,117,77,.12)}.chapter b{color:#2b3b50}.chapter small{display:block;color:#7a8797;margin-top:5px}.empty{padding:60px 20px;text-align:center;color:#758294;border:1px dashed #b9d9c8;background:#f8fcfa;border-radius:14px}@media(max-width:850px){.hero{grid-template-columns:1fr}.cover{max-width:280px}.meta{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr 1fr}}@media(max-width:520px){.meta,.list{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid #dcebe3}}</style></head><body><main class="wrap"><a class="back" href="./">← MangaAtlasRaw</a><div id="app" class="empty">Loading manga…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');async function init(){const slug=new URLSearchParams(location.search).get('slug')||'',app=document.getElementById('app');if(!slug){app.textContent='Manga not found.';return}try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),m=(d.mangas||[]).find(x=>String(x.slug)===slug);if(!m){app.textContent='Manga not found.';return}const chapters=(d.chapters||[]).filter(c=>c.mangaId===m.id).sort((a,b)=>Number(b.number)-Number(a.number)),cover=m.cover?(m.cover.start
