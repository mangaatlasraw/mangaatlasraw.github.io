name: Extract MangaAtlas template

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ hashFiles('MangaAtlas-clean-template-final.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract template at repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mangaatlas-extract
          unzip -q "MangaAtlas-clean-template-final.zip" -d /tmp/mangaatlas-extract
          shopt -s dotglob nullglob
          items=(/tmp/mangaatlas-extract/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            inner="${items[0]}"
            cp -a "$inner"/. ./
          else
            cp -a /tmp/mangaatlas-extract/. ./
          fi
          rm -rf /tmp/mangaatlas-extract
          rm -f "MangaAtlas-clean-template-final.zip"
          rm -f "hi"

      - name: Commit extracted template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Extract MangaAtlas clean template"
          git push
