<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta id="desc" name="description" content="Browse manga by country on MangaAtlas."><link id="canonical" rel="canonical"><title>Manga by Country | MangaAtlas</title><style>body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1380px;margin:auto;padding:40px 5%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top a{color:#aeb3c0}.links{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.links a{padding:8px 12px;border:1px solid #303340;border-radius:999px;color:#b9bfcc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#101118;border:1px solid #242732;border-radius:14px;padding:12px}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}.card h2{font-size:17px;margin:10px 0 5px}.card p{font-size:13px;color:#9296a5;line-height:1.5}.empty{padding:30px;border:1px dashed #303340;color:#9296a5;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="./">← MangaAtlas</a><h1 id="title">Manga</h1></div><div class="links"><a href="country.html?country=JP">🇯🇵 Japan</a><a href="country.html?country=US">🇺🇸 USA</a><a href="country.html?country=FR">🇫🇷 France</a><a href="country.html?country=BR">🇧🇷 Brazil</a></div><p id="intro"></p><div id="grid" class="grid"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');const map={JP:['🇯🇵 Japanese Manga RAW','Japan','Japanese manga titles and latest chapters.'],US:['🇺🇸 United States Manga','United States','Manga titles and latest chapters from the United States market.'],FR:['🇫🇷 France Manga','France','Manga titles and latest chapters from the French market.'],BR:['🇧🇷 Brazil Manga','Brazil','Manga titles and latest chapters from the Brazilian market.']};async function init(){const code=(new URLSearchParams(location.search).get('country')||'').toUpperCase(),info=map[code],grid=document.getElementById('grid');if(!info){document.getElementById('title').textContent='Country not found';return}document.getElementById('title').textContent=info[0];document.getElementById('intro').textContent=info[2];document.title=info[0]+' | MangaAtlas';document.getElementById('desc').content=info[2];document.getElementById('canonical').href=location.href.split('#')[0];try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),rows=(d.mangas||[]).filter(m=>m.country===code).sort((a,b)=>String(a.title).localeCompare(String(b.title)));grid.innerHTML=rows.length?rows.map(m=>{const cover=m.cover?(m.cover.startsWith('http')?m.cover:base+m.cover):'https://placehold.co/600x800/171922/ffffff?text=Manga';return `<a class="card" href="manga.html?slug=${encodeURIComponent(m.slug)}"><img src="${esc(cover)}" alt="${esc(m.title)} cover" loading="lazy"><h2>${esc(m.title)}</h2><p>${esc(m.author||'')}${m.status?' · '+esc(m.status):''}</p><p>${esc(m.description||'')}</p></a>`}).join(''):'<div class="empty">No manga published for this country yet.</div>'}catch(e){grid.innerHTML='<div class="empty">Content could not be loaded.</div>'}}init();</script></body></html>
