<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta name="description" content="日本の漫画作品と最新話を一覧でチェック。"><link rel="canonical" href="https://mangaatlasraw.github.io/country.html?country=JP"><title>日本漫画一覧 | mangaatlasraw.github.io</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#20242b;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1380px;margin:auto;padding:40px 5%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top a{color:#626b78}.links{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.links a{padding:8px 12px;border:1px solid #dfe3e8;border-radius:999px;color:#3f4855}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e2e5ea;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(30,40,55,.04)}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:#f1f3f6}.card h2{font-size:17px;margin:10px 0 5px}.card p{font-size:13px;color:#687181;line-height:1.5}.empty{padding:30px;border:1px dashed #cfd5de;color:#7a8391;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="./">← mangaatlasraw.github.io</a><h1>🇯🇵 日本漫画</h1></div><div class="links"><a href="country.html?country=JP">🇯🇵 Japan</a></div><p>日本の漫画作品と最新話を一覧でチェックできます。</p><div id="grid" class="grid"><div class="empty">漫画を読み込み中…</div></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');async function init(){const grid=document.getElementById('grid');try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),rows=(d.mangas||[]).filter(m=>m.country==='JP').sort((a,b)=>String(a.title).localeCompare(String(b.title),'ja'));grid.innerHTML=rows.length?rows.map(m=>{const cover=m.cover?(m.cover.startsWith('http')?m.cover:base+m.cover):'https://placehold.co/600x800/f1f3f6/596273?text=Manga';return `<a class="card" href="manga.html?slug=${encodeURIComponent(m.slug)}"><img src="${esc(cover)}" alt="${esc(m.title)} cover" loading="lazy"><h2>${esc(m.title)}</h2><p>${esc(m.author||'')}${m.status?' · '+esc(m.status):''}</p><p>${esc(m.description||'')}</p></a>`}).join(''):'<div class="empty">まだ漫画は登録されていません。</div>'}catch(e){grid.innerHTML='<div class="empty">コンテンツを読み込めませんでした。</div>'}}init();</script></body></html>
