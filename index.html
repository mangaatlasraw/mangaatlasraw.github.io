<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta name="description" content="MangaAtlasRaw — 日本の漫画・最新話・RAW情報をチェック。"><title>MangaAtlasRaw — 日本漫画 最新話</title><link rel="canonical" href="https://mangaatlasraw.github.io/"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f4ff 0,#f2fbf7 45%,#fff 100%);color:#182234;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #dfeee6;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;box-shadow:0 4px 18px rgba(46,125,84,.08)}.brand{font-size:24px;font-weight:900;background:linear-gradient(90deg,#6d28d9,#059669,#0891b2);-webkit-background-clip:text;background-clip:text;color:transparent}.navlinks{display:flex;gap:18px;color:#5f6b7b;font-size:14px}.navlinks a:hover{color:#059669}.hero{padding:65px 5%;background:linear-gradient(135deg,#f4efff,#effcf7 55%,#eefbff);border-bottom:1px solid #e2eee8;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;right:-70px;top:-100px;border-radius:50%;background:radial-gradient(circle,#bbf7d0,transparent 68%);opacity:.7}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px;letter-spacing:-2px;background:linear-gradient(90deg,#5b21b6,#059669,#0891b2);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:700px;color:#657184;font-size:17px;line-height:1.7}.section{max-width:1380px;margin:auto;padding:28px 5%}.country{padding:24px 0}.head{display:flex;gap:14px;align-items:center;margin-bottom:15px}.head h2{font-size:22px;color:#25324a}.line{height:2px;background:linear-gradient(90deg,#8b5cf6,#34d399,#22d3ee);flex:1;border-radius:99px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:11px;border:1px solid #dcebe4;border-radius:14px;background:rgba(255,255,255,.96);min-height:116px;box-shadow:0 6px 18px rgba(43,94,72,.07);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(35,117,77,.13);border-color:#9ed8b9}.card img{width:78px;height:96px;object-fit:cover;border-radius:8px;background:#eef7f2}.card strong{color:#26354b;line-height:1.45}.muted{color:#728091;font-size:12px;margin-top:7px}.empty{padding:20px;color:#718091;border:1px dashed #b9d8c8;border-radius:12px;background:#f8fcfa}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{padding:14px 5%;align-items:flex-start;gap:12px}.navlinks{gap:10px;flex-wrap:wrap}.hero{padding:45px 5%}.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="./">MangaAtlasRaw</a><div class="navlinks"><a href="#japan">🇯🇵 日本</a><a href="country.html?country=JP">漫画一覧</a><a href="admin/">Admin</a></div></nav><header class="hero"><h1>MangaAtlasRaw</h1><p>日本の漫画を中心に、作品情報と最新話をシンプルにチェックできる漫画サイトです。</p></header><main id="app" class="section"><div class="empty">漫画を読み込み中…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');async function init(){try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),by=new Map((d.mangas||[]).map(m=>[m.id,m])),latest=[...(d.chapters||[])].filter(x=>x.country==='JP').sort((a,b)=>Date.parse(b.createdAt||b.updatedAt||'')-Date.parse(a.createdAt||a.updatedAt||'')||Number(b.number)-Number(a.number));document.getElementById('app').innerHTML='<section id="japan" class="country"><div class="head"><h2>🇯🇵 日本の最新話</h2><div class="line"></div></div><div class="grid">'+(latest.length?latest.slice(0,60).map(ch=>{const m=by.get(ch.mangaId)||{},u=m.cover?(m.cover.startsWith('http')?m.cover:base+m.cover):'https://placehold.co/300x400/f1f3f6/596273?text=Manga';return `<a class="card" href="chapter.html?slug=${encodeURIComponent(ch.slug)}"><img src="${esc(u)}" alt="${esc(m.title||'漫画')} cover" loading="lazy"><div><strong>${esc(ch.title||((m.title||'漫画')+' 第'+ch.number+'話'))}</strong><div class="muted">第${esc(ch.number)}話 · ${esc(m.title||'漫画')}</div></div></a>`}).join(''):'<div class="empty">まだ漫画・最新話は登録されていません。</div>')+'</div></section>'}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="empty">コンテンツを読み込めませんでした。</div>'}}init();</script></body></html>
