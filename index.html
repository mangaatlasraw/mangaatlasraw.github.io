<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta id="desc" name="description" content="MangaAtlas — manga discovery, latest chapters and releases."><link id="canonical" rel="canonical"><meta property="og:type" content="website"><meta property="og:site_name" content="MangaAtlas"><meta property="og:title" content="MangaAtlas — Latest Manga Chapters"><meta id="ogDesc" property="og:description" content="MangaAtlas — manga discovery, latest chapters and releases."><title>MangaAtlas — Latest Manga Chapters</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:18px;color:#aeb3c0;font-size:14px}.hero{padding:60px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px}.hero p{max-width:700px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:28px 5%}.country{padding:24px 0;border-bottom:1px solid #22252e}.head{display:flex;gap:14px;align-items:center;margin-bottom:15px}.head h2{font-size:22px}.line{height:1px;background:#22252e;flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px;border:1px solid #242732;border-radius:11px;background:#101118;min-height:116px}.card img{width:78px;height:96px;object-fit:cover;border-radius:7px;background:#171922}.muted{color:#9296a5;font-size:12px;margin-top:7px}.empty{padding:20px;color:#9296a5;border:1px dashed #303340;border-radius:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{padding:14px 5%;align-items:flex-start}.navlinks{gap:10px;flex-wrap:wrap}.hero{padding:45px 5%}.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="./">Manga<span>Atlas</span></a><div class="navlinks"><a href="#japan">🇯🇵 Japan</a><a href="#usa">🇺🇸 USA</a><a href="#france">🇫🇷 France</a><a href="#brazil">🇧🇷 Brazil</a><a href="admin/">Admin</a></div></nav><header class="hero"><h1>Discover manga beyond borders.</h1><p>Latest manga chapters and manga information, powered by a clean GitHub-only content system.</p></header><main id="app" class="section"><div class="empty">Loading manga…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');document.getElementById('canonical').href=location.href.split('#')[0];async function init(){try{const d=await fetch(base+'data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),by=new Map((d.mangas||[]).map(m=>[m.id,m])),latest=[...(d.chapters||[])].sort((a,b)=>Date.parse(b.createdAt||b.updatedAt||'')-Date.parse(a.createdAt||a.updatedAt||'')||Number(b.number)-Number(a.number)),groups=[['japan','🇯🇵 Japan','JP'],['usa','🇺🇸 United States','US'],['france','🇫🇷 France','FR'],['brazil','🇧🇷 Brazil','BR']];document.getElementById('app').innerHTML=groups.map(([id,name,c])=>{const rows=latest.filter(x=>x.country===c).slice(0,40);return `<section id="${id}" class="country"><div class="head"><h2>${name}</h2><div class="line"></div></div><div class="grid">${rows.length?rows.map(ch=>{const m=by.get(ch.mangaId)||{},u=m.cover?(m.cover.startsWith('http')?m.cover:base+m.cover):'https://placehold.co/300x400/151821/ffffff?text=Manga';return `<a class="card" href="chapter.html?slug=${encodeURIComponent(ch.slug)}"><img src="${esc(u)}" alt="${esc(m.title||'Manga')} cover" loading="lazy"><div><strong>${esc(ch.title||((m.title||'Manga')+' — Chapter '+ch.number))}</strong><div class="muted">Chapter ${esc(ch.number)} · ${esc(m.title||'Manga')}</div></div></a>`}).join(''):'<div class="empty">No chapters yet.</div>'}</div></section>`}).join('')}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="empty">Content could not be loaded.</div>'}}init();</script></body></html>
