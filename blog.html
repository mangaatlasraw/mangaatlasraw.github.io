<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="ctFdojnxc7KXyHKZDaj0AqbMx8isbiw1KwHguN1EZ-A"><meta name="description" content="MangaAtlas blog — latest manga releases and chapter updates."><link rel="canonical" href="./blog.html"><title>Manga Blog — Latest Releases | MangaAtlas</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{padding:16px 5%;border-bottom:1px solid #20222b}.wrap{max-width:1050px;margin:auto;padding:40px 5%}.post{padding:22px 0;border-bottom:1px solid #242732}.post h2{margin:8px 0}.post p{color:#9296a5;line-height:1.6}.tag{display:inline-block;padding:5px 9px;border:1px solid #303746;border-radius:999px;color:#b9c1cf;font-size:11px;margin-right:6px}.empty{padding:25px;border:1px dashed #303340;color:#9296a5}</style></head><body><nav class="nav"><a href="./">← MangaAtlas</a> · <a href="country.html?country=JP">Japan</a> · <a href="country.html?country=FR">France</a> · <a href="admin/">Admin</a></nav><main class="wrap"><h1>Latest Manga Releases</h1><p>Updates are generated from the GitHub content database.</p><section id="posts"><div class="empty">Loading…</div></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');fetch(base+'data/content.json?v='+Date.now()).then(r=>r.json()).then(d=>{const by=new Map((d.mangas||[]).map(m=>[m.id,m])),rows=[...(d.chapters||[])].sort((a,b)=>Date.parse(b.createdAt||'')-Date.parse(a.createdAt||'')).slice(0,40);document.getElementById('posts').innerHTML=rows.length?rows.map(c=>{const m=by.get(c.mangaId)||{};return `<article class="post"><span class="tag">${esc(c.country||m.country||'Global')}</span><span class="tag">Chapter ${esc(c.number)}</span><h2>${esc(m.title||'Manga')} — ${esc(c.title||'Latest chapter')}</h2><p>${esc(m.description||'New chapter update on MangaAtlas.')}</p><a href="chapter.html?slug=${encodeURIComponent(c.slug)}">Open chapter →</a></article>`}).join(''):'<div class="empty">No releases yet.</div>'}).catch(()=>document.getElementById('posts').innerHTML='<div class="empty">Content could not be loaded.</div>');</script></body></html>
